name: Docker image

on:
  push:
    branches:
      - master
    tags:
      - "server-v*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Tag matches package version
        if: startsWith(github.ref, 'refs/tags/server-v')
        run: |
          version="$(node -p 'require("./packages/server/package.json").version')"
          [[ "server-v$version" == "$GITHUB_REF_NAME" ]] || { echo "::error::tag $GITHUB_REF_NAME but packages/server is $version"; exit 1; }

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=match,pattern=server-v(\d+\.\d+\.\d+)$,group=1
            type=match,pattern=server-v(\d+\.\d+)\.\d+$,group=1
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/server-v') }}
            type=raw,value=edge,enable={{is_default_branch}}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
