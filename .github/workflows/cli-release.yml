name: CLI release

on:
  push:
    tags:
      - "cli-v*"

permissions:
  contents: write

concurrency:
  group: cli-latest
  cancel-in-progress: false

jobs:
  standalone:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Tag matches package version
        run: |
          version="$(node -p 'require("./packages/cli/package.json").version')"
          [[ "cli-v$version" == "$GITHUB_REF_NAME" ]] || { echo "::error::tag $GITHUB_REF_NAME but packages/cli is $version"; exit 1; }

      - run: npm ci

      - run: npm run build:standalone -w @karotto/cli

      - name: Smoke test
        run: |
          mkdir "$RUNNER_TEMP/bare" && cp packages/cli/dist/standalone/karotto "$RUNNER_TEMP/bare/"
          cd "$RUNNER_TEMP/bare" && [[ "$(./karotto --version)" == "${GITHUB_REF_NAME#cli-v}" ]]

      - name: Add this build to the release manifest
        working-directory: packages/cli/dist/standalone
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download cli-latest --repo "$GITHUB_REPOSITORY" --pattern releases.json || echo '[]' >releases.json
          node ../../../../.github/scripts/cli-manifest.mjs releases.json karotto ../../../core/src/api-revision.json "${GITHUB_REF_NAME#cli-v}"
          cat releases.json

      - uses: softprops/action-gh-release@v2
        with:
          name: karotto CLI ${{ github.ref_name }}
          files: packages/cli/dist/standalone/karotto
          generate_release_notes: true
          make_latest: "false"

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: cli-latest
          name: karotto CLI (latest)
          body: Newest `karotto` client, currently ${{ github.ref_name }}, and `releases.json`, which `karotto update` reads to pick the newest build your server supports.
          files: |
            packages/cli/dist/standalone/karotto
            packages/cli/dist/standalone/releases.json
          prerelease: true
          make_latest: "false"
