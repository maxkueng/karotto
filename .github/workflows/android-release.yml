name: Android release

on:
  push:
    tags:
      - "android-v*"

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Version from tag
        id: version
        run: |
          name="${GITHUB_REF_NAME#android-v}"
          IFS=. read -r major minor patch <<<"${name%%-*}"
          echo "name=$name" >>"$GITHUB_OUTPUT"
          echo "code=$((major * 10000 + minor * 100 + patch))" >>"$GITHUB_OUTPUT"

      - name: Restore keystore
        run: echo "$ANDROID_KEYSTORE_BASE64" | base64 -d >"$RUNNER_TEMP/upload.jks"
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}

      - name: Build signed APK
        run: ./gradlew --no-daemon assembleRelease
        env:
          KAROTTO_VERSION_NAME: ${{ steps.version.outputs.name }}
          KAROTTO_VERSION_CODE: ${{ steps.version.outputs.code }}
          KAROTTO_KEYSTORE: ${{ runner.temp }}/upload.jks
          KAROTTO_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KAROTTO_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KAROTTO_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Name the artifact
        run: cp app/build/outputs/apk/release/app-release.apk "karotto-${{ steps.version.outputs.name }}.apk"

      - uses: softprops/action-gh-release@v2
        with:
          name: karotto Android ${{ steps.version.outputs.name }}
          files: packages/android/karotto-${{ steps.version.outputs.name }}.apk
          generate_release_notes: true
